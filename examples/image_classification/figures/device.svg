<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1520 600" width="1520" height="600">
  <title>Camera-equipped pet door: where the camera, controller and latch sit</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7e4dc"/>
      <stop offset="1" stop-color="#d6d2c8"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe0f2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b3cbe6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e8a82"/>
      <stop offset="1" stop-color="#6b6862"/>
    </linearGradient>
    <linearGradient id="cone" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#2a78d6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2a78d6" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="1520" height="600" fill="#fcfcfb"/>

  <!-- Floor -->
  <rect x="40" y="478" width="1000" height="3" fill="#c3c2b7"/>

  <!-- Door (side view: the door is the vertical slab; the pet door is cut into it) -->
  <rect x="640" y="140" width="44" height="338" fill="url(#wall)" stroke="#b9b5aa" stroke-width="2"/>
  <!-- Pet door frame and flap -->
  <rect x="628" y="312" width="68" height="166" rx="8" fill="#5b5a57"/>
  <rect x="644" y="324" width="36" height="142" rx="4" fill="url(#flap)" stroke="#8aa9cf" stroke-width="1.5"/>
  <!-- Latch -->
  <rect x="652" y="458" width="22" height="12" rx="3" fill="#eb6834"/>
  <!-- Camera + controller housing on top of the frame -->
  <rect x="614" y="250" width="96" height="58" rx="10" fill="#3d3c3a"/>
  <circle cx="626" cy="279" r="13" fill="#1a1a19" stroke="#6f6d68" stroke-width="2"/>
  <circle cx="626" cy="279" r="5" fill="#2a78d6"/>
  <rect x="646" y="266" width="50" height="26" rx="4" fill="#2a78d6"/>
  <!-- Motion sensor dome -->
  <path d="M 676 250 a 12 12 0 0 1 24 0 Z" fill="#e9e8e4" stroke="#8b8983" stroke-width="1.5"/>
  <!-- Field of view toward the approaching animal -->
  <path d="M 614 279 L 150 170 L 150 478 L 614 290 Z" fill="url(#cone)"/>

  <!-- Cat approaching -->
  <g fill="url(#fur)">
    <ellipse cx="330" cy="400" rx="118" ry="50"/>
    <rect x="232" y="420" width="24" height="58" rx="10"/>
    <rect x="270" y="426" width="24" height="52" rx="10"/>
    <rect x="370" y="426" width="24" height="52" rx="10"/>
    <rect x="404" y="420" width="24" height="58" rx="10"/>
    <circle cx="460" cy="350" r="44"/>
    <path d="M 432 318 L 438 282 L 460 310 Z"/>
    <path d="M 470 308 L 494 284 L 494 322 Z"/>
    <path d="M 216 392 C 160 380 150 320 186 288" fill="none" stroke="#7a766f" stroke-width="18" stroke-linecap="round"/>
  </g>
  <circle cx="478" cy="346" r="5" fill="#fcfcfb"/>
  <circle cx="479" cy="346" r="2.5" fill="#1a1a19"/>
  <path d="M 500 362 L 530 356 M 500 368 L 530 370" stroke="#c3c2b7" stroke-width="1.5"/>

  <!-- Callouts -->
  <g font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
    <path d="M 640 262 L 560 160" stroke="#898781" stroke-width="1"/>
    <circle cx="640" cy="262" r="3" fill="#898781"/>
    <text x="560" y="128" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="middle">Camera + controller</text>
    <text x="560" y="149" font-size="15" fill="#52514e" text-anchor="middle">CNN on a microcontroller, ≥512 KiB RAM</text>

    <path d="M 688 248 L 800 190" stroke="#898781" stroke-width="1"/>
    <text x="808" y="182" font-size="17" font-weight="600" fill="#0b0b0b">Motion trigger</text>
    <text x="808" y="203" font-size="15" fill="#52514e">wakes the camera, frames the animal</text>

    <path d="M 674 464 L 800 520" stroke="#898781" stroke-width="1"/>
    <text x="808" y="518" font-size="17" font-weight="600" fill="#0b0b0b">Latch</text>
    <text x="808" y="539" font-size="15" fill="#52514e">opens for the cat, stays locked for the dog</text>

    <path d="M 696 395 L 800 395" stroke="#898781" stroke-width="1"/>
    <text x="808" y="391" font-size="17" font-weight="600" fill="#0b0b0b">Flap</text>
    <text x="808" y="412" font-size="15" fill="#52514e">in the door</text>
  </g>

  <!-- Inset: what the network sees -->
  <g transform="translate(1180 170)">
    <rect x="-8" y="-8" width="208" height="208" rx="6" fill="#ffffff" stroke="#e1e0d9" stroke-width="2"/>
    <image x="0" y="0" width="192" height="192" image-rendering="pixelated" style="image-rendering: pixelated" xlink:href="data:image/png;base64,"/>
    <g font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="96" y="-46" font-size="17" font-weight="600" fill="#0b0b0b">What the network sees</text>
      <text x="96" y="-25" font-size="15" fill="#52514e">48×48 RGB, area-averaged</text>
      <text x="96" y="236" font-size="15" fill="#52514e">a real input from the test set</text>
    </g>
  </g>
</svg>
