<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 72 1400 470" width="1400" height="470">
  <title>Wake Word Detection — log-mel features + GRU network (train.c)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="560" fill="#fcfcfb"/>
  <text x="40" y="98" text-anchor="start" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#374151">Feature extraction, audio_features.c: one 1 s clip → 49 frames × 20 log-mel energies</text>
  <rect x="40" y="125" width="230" height="110" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="155.0" y="160.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Microphone</text>
  <text x="155.0" y="181.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">16 kHz, 16-bit PCM</text>
  <text x="155.0" y="202.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">rolling 1 s window</text>
  <rect x="340" y="125" width="230" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="455.0" y="160.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Frames</text>
  <text x="455.0" y="181.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">512 samples (32 ms),</text>
  <text x="455.0" y="202.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">every 320 (20 ms): 49 frames</text>
  <rect x="640" y="125" width="270" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="775.0" y="160.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Log-mel energies</text>
  <text x="775.0" y="181.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">Hann window · FFT · power</text>
  <text x="775.0" y="202.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">20 mel bands, 0–8 kHz · log</text>
  <rect x="980" y="125" width="270" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="1115.0" y="160.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Normalize per clip</text>
  <text x="1115.0" y="181.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">all 49 × 20 values to</text>
  <text x="1115.0" y="202.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">mean 0, variance 1</text>
  <line x1="270" y1="180" x2="340" y2="180" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="180" x2="640" y2="180" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="910" y1="180" x2="980" y2="180" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1115 235 L 1115 300 L 155 300 L 155 380" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="292" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#374151">one frame of 20 values per call, 49 calls per clip</text>
  <rect x="40" y="380" width="230" height="110" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="155.0" y="430.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Input</text>
  <text x="155.0" y="451.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">20 (one frame)</text>
  <rect x="380" y="380" width="230" height="110" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="495.0" y="430.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">GRU · gated</text>
  <text x="495.0" y="451.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">32 units</text>
  <path d="M 450 380 C 450 330 540 330 540 376" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="495" y="340" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4f46e5">hidden state h, across the clip's 49 frames</text>
  <rect x="720" y="380" width="230" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="835.0" y="430.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Output · Sigmoid</text>
  <text x="835.0" y="451.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">1 (wake-word probability)</text>
  <rect x="1060" y="380" width="250" height="110" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="1185.0" y="420.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Decision</text>
  <text x="1185.0" y="441.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">after the last frame:</text>
  <text x="1185.0" y="462.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">wake word if ≥ 0.5</text>
  <line x1="270" y1="435" x2="380" y2="435" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="435" x2="720" y2="435" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="950" y1="435" x2="1060" y2="435" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700.0" y="530" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280">5,121 parameters · nn_reset_state() clears h before each clip</text>
</svg>
