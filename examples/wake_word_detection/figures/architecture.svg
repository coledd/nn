<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 72 1400 470" width="1400" height="470">
  <title>Wake Word Detection — log-mel features + CNN (train_cnn.c)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="560" fill="#fcfcfb"/>
  <text x="40" y="98" text-anchor="start" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#374151">Feature extraction, audio_features.c: one 1 s clip → 49 frames × 20 log-mel energies</text>
  <rect x="40" y="125" width="230" height="110" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="155.0" y="160.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Microphone</text>
  <text x="155.0" y="181.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">16 kHz, 16-bit PCM</text>
  <text x="155.0" y="202.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">rolling 1 s window</text>
  <rect x="340" y="125" width="230" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="455.0" y="160.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Frames</text>
  <text x="455.0" y="181.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">512 samples (32 ms),</text>
  <text x="455.0" y="202.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">every 320 (20 ms): 49 frames</text>
  <rect x="640" y="125" width="270" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="775.0" y="160.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Log-mel energies</text>
  <text x="775.0" y="181.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">Hann window · FFT · power</text>
  <text x="775.0" y="202.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">20 mel bands, 0–8 kHz · log</text>
  <rect x="980" y="125" width="270" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="1115.0" y="160.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Normalize per clip</text>
  <text x="1115.0" y="181.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">all 49 × 20 values to</text>
  <text x="1115.0" y="202.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">mean 0, variance 1</text>
  <line x1="270" y1="180" x2="340" y2="180" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="180" x2="640" y2="180" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="910" y1="180" x2="980" y2="180" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1115 235 L 1115 300 L 130 300 L 130 380" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="292" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#374151">the whole clip at once: a 49 × 20 image, time down, mel bands across</text>
  <rect x="40" y="380" width="180" height="110" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="130.0" y="430.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Input</text>
  <text x="130.0" y="451.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">49 × 20 × 1</text>
  <rect x="274" y="380" width="180" height="110" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="364.0" y="419.5" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Conv 3×3 · GELU</text>
  <text x="364.0" y="440.5" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">16 filters, 2×2 max pool</text>
  <text x="364.0" y="461.5" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">→ 24 × 10 × 16</text>
  <rect x="508" y="380" width="180" height="110" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="598.0" y="419.5" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Conv 3×3 · GELU</text>
  <text x="598.0" y="440.5" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">32 filters, 2×2 max pool</text>
  <text x="598.0" y="461.5" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">→ 12 × 5 × 32</text>
  <rect x="742" y="380" width="180" height="110" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="832.0" y="419.5" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Conv 3×3 · GELU</text>
  <text x="832.0" y="440.5" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">32 filters, 2×2 max pool</text>
  <text x="832.0" y="461.5" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">→ 6 × 2 × 32</text>
  <rect x="976" y="380" width="180" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1066.0" y="419.5" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Output · Softmax</text>
  <text x="1066.0" y="440.5" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">2: other,</text>
  <text x="1066.0" y="461.5" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">wake word</text>
  <rect x="1210" y="380" width="180" height="110" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="1300.0" y="419.5" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Decision</text>
  <text x="1300.0" y="440.5" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">wake word if its</text>
  <text x="1300.0" y="461.5" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">probability ≥ threshold</text>
  <line x1="220" y1="435" x2="274" y2="435" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="454" y1="435" x2="508" y2="435" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="688" y1="435" x2="742" y2="435" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="922" y1="435" x2="976" y2="435" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1156" y1="435" x2="1210" y2="435" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700.0" y="530" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280">14,818 parameters · about 1.8 million multiply-adds per clip · 20% dropout before the output, training only</text>
</svg>
