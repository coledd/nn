<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600">
  <title>Predictive Maintenance — FFT fingerprint + FC network (train.c)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="600" fill="#ffffff"/>
  <text x="700.0" y="38" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Predictive Maintenance — FFT fingerprint + FC network (train.c)</text>
  <text x="700.0" y="60" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#6b7280">examples/predictive_maintenance: vibration_features.c → health_monitor.c → nn.c, all running on the STM32</text>
  <text x="40" y="98" text-anchor="start" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#374151">Feature extraction, once per snapshot (8 frames × 4096 samples ≈ 4.9 s)</text>
  <rect x="40" y="125" width="210" height="110" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="145.0" y="165.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Accelerometer</text>
  <text x="145.0" y="186.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">IIS3DWB, 26.7 kHz</text>
  <text x="145.0" y="207.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">decimated ÷4 → 6.67 kHz</text>
  <rect x="320" y="125" width="190" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="415.0" y="165.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Hann · FFT</text>
  <text x="415.0" y="186.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">4096 points</text>
  <text x="415.0" y="207.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">1.63 Hz per bin</text>
  <rect x="600" y="110" width="300" height="64" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="750.0" y="137.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Vibration spectrum</text>
  <text x="750.0" y="158.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">48 log bands, 8 Hz – 3.2 kHz</text>
  <rect x="600" y="190" width="300" height="84" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="750.0" y="217.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Envelope spectrum</text>
  <text x="750.0" y="238.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">1–3.2 kHz band → IFFT → |analytic|</text>
  <text x="750.0" y="259.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">→ FFT · 16 log bands, 8–500 Hz</text>
  <rect x="990" y="125" width="200" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="1090.0" y="165.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Fingerprint</text>
  <text x="1090.0" y="186.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">64 log band energies</text>
  <text x="1090.0" y="207.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">Welch-averaged</text>
  <line x1="250" y1="180" x2="320" y2="180" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 510 165 L 555 165 L 555 142 L 600 142" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 510 195 L 555 195 L 555 232 L 600 232" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 900 142 L 945 142 L 945 165 L 990 165" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 900 232 L 945 232 L 945 195 L 990 195" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1230" y="125" width="150" height="110" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="1305.0" y="165.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Baseline</text>
  <text x="1305.0" y="186.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">commissioning</text>
  <text x="1305.0" y="207.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">mean, in flash</text>
  <path d="M 1090 125 L 1090 100 L 1305 100 L 1305 125" fill="none" stroke="#ca8a04" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-yellow)"/>
  <text x="1197" y="92" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#ca8a04">first 4 snapshots</text>
  <path d="M 1090 235 L 1090 320 L 160 320 L 160 380" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1305 235 L 1305 340 L 230 340 L 230 380" fill="none" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow-yellow)"/>
  <text x="620" y="312" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#374151">present fingerprint</text>
  <text x="760" y="360" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#ca8a04">present − baseline (how far this machine has moved from its own past)</text>
  <rect x="40" y="380" width="250" height="110" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="165.0" y="420.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Input</text>
  <text x="165.0" y="441.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">128 = 64 present</text>
  <text x="165.0" y="462.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">+ 64 change from baseline</text>
  <rect x="370" y="380" width="190" height="110" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="465.0" y="430.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">FC · GELU</text>
  <text x="465.0" y="451.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">32 units</text>
  <rect x="640" y="380" width="190" height="110" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="735.0" y="430.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">FC · GELU</text>
  <text x="735.0" y="451.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">16 units</text>
  <rect x="910" y="380" width="200" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1010.0" y="430.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Output · Softmax</text>
  <text x="1010.0" y="451.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">8 conditions</text>
  <rect x="1190" y="380" width="190" height="110" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="1285.0" y="420.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Alert</text>
  <text x="1285.0" y="441.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">3 faulty snapshots</text>
  <text x="1285.0" y="462.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">in a row</text>
  <line x1="290" y1="435" x2="370" y2="435" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="435" x2="640" y2="435" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="830" y1="435" x2="910" y2="435" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1110" y1="435" x2="1190" y2="435" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700.0" y="535" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#374151">HEALTHY · IMBALANCE · MISALIGNMENT · LOOSENESS · BEARING_OUTER · BEARING_INNER · GEAR_TOOTH · LUBRICATION</text>
  <text x="700.0" y="565" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280">4,792 parameters · 5.1 KB as an int8 inplace model in flash</text>
</svg>
